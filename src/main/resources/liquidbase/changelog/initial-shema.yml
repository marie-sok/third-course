databaseChangeLog:
  - changeSet:
      id: 000-create-tables
      author: hogwarts
      changes:
        - createTable:
            tableName: student
            columns:
              - column:
                  name: id
                  type: bigint
                  constraints:
                    primaryKey: true
                    nullable: false
                    autoIncrement: true
              - column:
                  name: name
                  type: varchar(255)
              - column:
                  name: age
                  type: integer

        - createTable:
            tableName: faculty
            columns:
              - column:
                  name: id
                  type: bigint
                  constraints:
                    primaryKey: true
                    nullable: false
                    autoIncrement: true
              - column:
                  name: name
                  type: varchar(255)
              - column:
                  name: color
                  type: varchar(100)